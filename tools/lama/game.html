<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Frank Run | Couloir</title>
<meta name="description" content="Help Frank the llama dodge Divine Orbs and collect Exalts in this endless runner.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-jsKuNwamSbECoYw-7tuuA.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0908;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
  }

  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 3 / 1;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 6px;
    image-rendering: auto;
    box-shadow: 0 0 40px rgba(232, 166, 48, 0.08), 0 0 1px rgba(232, 166, 48, 0.15);
  }

  #ui-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .screen-overlay {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    pointer-events: auto;
  }
  .screen-overlay.active { display: flex; }

  .game-title {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: bold;
    color: #e8a630;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 2px 12px rgba(232, 166, 48, 0.4);
  }

  .game-subtitle {
    font-size: clamp(11px, 2vw, 16px);
    color: #8a7a60;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .prompt {
    font-size: clamp(12px, 2.2vw, 18px);
    color: #c4a44a;
    animation: blink 1.2s ease-in-out infinite;
    margin-top: 8px;
  }

  .score-display {
    font-size: clamp(16px, 3vw, 28px);
    color: #e8a630;
    margin-bottom: 4px;
  }

  .high-score-label {
    font-size: clamp(10px, 1.8vw, 14px);
    color: #8a7a60;
    letter-spacing: 1px;
  }

  .final-score {
    font-size: clamp(32px, 6vw, 56px);
    font-weight: bold;
    color: #e8a630;
    text-shadow: 0 2px 12px rgba(232, 166, 48, 0.4);
  }

  .new-best {
    font-size: clamp(11px, 2vw, 16px);
    color: #60dd60;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: none;
  }
  .new-best.show { display: block; }

  .stats-row {
    display: flex;
    gap: clamp(16px, 4vw, 40px);
    color: #8a7a60;
    font-size: clamp(10px, 1.6vw, 14px);
  }
  .stats-row span { color: #c4a44a; }

  #hud {
    position: absolute;
    top: 12px; right: 16px;
    text-align: right;
    pointer-events: none;
  }
  #hud-score {
    font-size: clamp(16px, 3vw, 24px);
    color: #e8a630;
    font-family: 'Courier New', monospace;
    font-weight: bold;
  }
  #hud-high {
    font-size: clamp(9px, 1.4vw, 12px);
    color: #6a5a40;
    font-family: 'Courier New', monospace;
  }
  #hud-exalts {
    font-size: clamp(10px, 1.6vw, 14px);
    color: #c4a44a;
    font-family: 'Courier New', monospace;
  }

  .watermark {
    position: absolute;
    bottom: 6px; left: 10px;
    font-size: 10px;
    color: #2a2218;
    font-family: 'Courier New', monospace;
    pointer-events: none;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @media (max-width: 600px) {
    #game-wrapper {
      aspect-ratio: 2.5 / 1;
    }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="game"></canvas>

  <div id="ui-overlay">
    <!-- START SCREEN -->
    <div class="screen-overlay active" id="start-screen">
      <div class="game-title">Frank Run</div>
      <div class="game-subtitle">an endless runner by couloir</div>
      <div class="prompt" id="start-prompt">Press SPACE or Tap to Start</div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div class="screen-overlay" id="gameover-screen">
      <div class="game-subtitle">Game Over</div>
      <div class="final-score" id="final-score">0</div>
      <div class="new-best" id="new-best">★ New Best! ★</div>
      <div class="stats-row">
        <div>Distance: <span id="stat-distance">0</span>m</div>
        <div>Exalts: <span id="stat-exalts">0</span></div>
        <div>Best: <span id="stat-best">0</span></div>
      </div>
      <div class="prompt">Press SPACE or Tap to Retry</div>
    </div>
  </div>

  <div id="hud" style="display:none;">
    <div id="hud-score">0</div>
    <div id="hud-high">HI 0</div>
    <div id="hud-exalts">✦ 0</div>
  </div>

  <div class="watermark">couloir.gg</div>
</div>

<script>
// ============================================================
// FRANK RUN - Endless Runner
// ============================================================
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Internal resolution
  const W = 900;
  const H = 300;
  canvas.width = W;
  canvas.height = H;

  // ---- AUDIO (Web Audio API synthesized) ----
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime;

    switch(type) {
      case 'jump':
        osc.type = 'square';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.exponentialRampToValueAtTime(520, t + 0.1);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t); osc.stop(t + 0.15);
        break;
      case 'collect':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.start(t); osc.stop(t + 0.12);
        // Second note
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(900, t + 0.06);
        osc2.frequency.exponentialRampToValueAtTime(1400, t + 0.14);
        gain2.gain.setValueAtTime(0.08, t + 0.06);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc2.start(t + 0.06); osc2.stop(t + 0.18);
        break;
      case 'hit':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.3);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.start(t); osc.stop(t + 0.35);
        break;
      case 'milestone':
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, t);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t); osc.stop(t + 0.15);
        const m2 = audioCtx.createOscillator();
        const mg2 = audioCtx.createGain();
        m2.connect(mg2); mg2.connect(audioCtx.destination);
        m2.type = 'triangle';
        m2.frequency.setValueAtTime(660, t + 0.12);
        mg2.gain.setValueAtTime(0.08, t + 0.12);
        mg2.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        m2.start(t + 0.12); m2.stop(t + 0.3);
        break;
    }
  }

  // ---- SPRITES ----
  const sprites = {};
  let spritesLoaded = 0;
  const spriteTotal = 3;

  function loadSprite(name, src) {
    const img = new Image();
    img.onload = () => { spritesLoaded++; };
    img.src = src;
    sprites[name] = img;
  }

  loadSprite('run', '/assets/mascot/mascot_idle.png');
  loadSprite('jump', '/assets/mascot/mascot_silly.png');
  loadSprite('hit', '/assets/mascot/mascot_look.png');

  // ---- GAME STATE ----
  const GROUND_Y = H - 50;
  const FRANK_X = 100;
  const FRANK_W = 60;
  const FRANK_H = 76;
  const GRAVITY = 0.65;
  const JUMP_FORCE = -12;

  let state = 'start'; // start, playing, gameover
  let frank = {};
  let obstacles = [];
  let collectibles = [];
  let particles = [];
  let groundTiles = [];
  let bgStars = [];
  let bgDust = [];
  let bgMountains = [];
  let speed = 0;
  let score = 0;
  let exaltCount = 0;
  let distance = 0;
  let highScore = parseInt(localStorage.getItem('frankrun_hi') || '0');
  let shakeTimer = 0;
  let shakeIntensity = 0;
  let lastMilestone = 0;
  let frameCount = 0;
  let spawnTimer = 0;
  let collectibleTimer = 0;
  let difficultyLevel = 0;

  // Background layers
  function initBg() {
    // Stars - more of them, with twinkling
    bgStars = [];
    for (let i = 0; i < 80; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * (GROUND_Y - 60) + 10,
        size: Math.random() * 1.8 + 0.2,
        speed: Math.random() * 0.2 + 0.05,
        alpha: Math.random() * 0.5 + 0.1,
        twinkleSpeed: Math.random() * 0.03 + 0.01,
        twinklePhase: Math.random() * Math.PI * 2,
      });
    }

    // Floating dust/embers
    bgDust = [];
    for (let i = 0; i < 20; i++) {
      bgDust.push({
        x: Math.random() * W,
        y: Math.random() * (GROUND_Y - 30),
        size: Math.random() * 2 + 0.5,
        speedX: Math.random() * 0.3 + 0.1,
        speedY: (Math.random() - 0.5) * 0.2,
        alpha: Math.random() * 0.25 + 0.05,
        phase: Math.random() * Math.PI * 2,
      });
    }

    // Mountain layers (far to near)
    bgMountains = [];
    const layers = [
      { y: GROUND_Y - 10, height: 20, speed: 0.1, color: '#0d0b08', segments: 12 },
      { y: GROUND_Y - 5, height: 35, speed: 0.2, color: '#0f0d0a', segments: 10 },
      { y: GROUND_Y, height: 50, speed: 0.35, color: '#121010', segments: 8 },
    ];
    layers.forEach(l => {
      const peaks = [];
      for (let i = 0; i <= l.segments; i++) {
        peaks.push({
          xOff: (i / l.segments) * (W + 200) - 100,
          h: Math.random() * l.height + l.height * 0.3,
        });
      }
      bgMountains.push({ ...l, peaks, scrollX: 0 });
    });

    // Ground tiles - more variation
    groundTiles = [];
    for (let i = 0; i < 50; i++) {
      groundTiles.push({
        x: Math.random() * (W + 200),
        w: Math.random() * 30 + 5,
        h: Math.random() * 3 + 1,
        y: GROUND_Y + Math.random() * 35 + 4,
        speed: Math.random() * 0.5 + 0.8,
        alpha: Math.random() * 0.4 + 0.2,
      });
    }
    // Scattered rocks on ground surface
    for (let i = 0; i < 15; i++) {
      groundTiles.push({
        x: Math.random() * (W + 200),
        w: Math.random() * 6 + 2,
        h: Math.random() * 3 + 2,
        y: GROUND_Y + 1 + Math.random() * 6,
        speed: 1,
        alpha: Math.random() * 0.3 + 0.3,
        isRock: true,
      });
    }
  }

  function resetGame() {
    frank = {
      x: FRANK_X,
      y: GROUND_Y - FRANK_H,
      vy: 0,
      grounded: true,
      sprite: 'run',
      waddlePhase: 0,
    };
    obstacles = [];
    collectibles = [];
    particles = [];
    speed = 4;
    score = 0;
    exaltCount = 0;
    distance = 0;
    shakeTimer = 0;
    lastMilestone = 0;
    frameCount = 0;
    spawnTimer = 0;
    collectibleTimer = 0;
    difficultyLevel = 0;
    initBg();
  }

  // ---- SPAWNING ----
  function spawnObstacle() {
    const size = 26 + Math.random() * 12;
    obstacles.push({
      x: W + 20,
      y: GROUND_Y - size,
      w: size,
      h: size,
      rotation: 0,
      rotSpeed: (Math.random() - 0.5) * 0.1,
    });
  }

  function spawnCollectible() {
    const floatY = GROUND_Y - FRANK_H - 20 - Math.random() * 50;
    collectibles.push({
      x: W + 20,
      y: floatY,
      w: 20,
      h: 20,
      bobPhase: Math.random() * Math.PI * 2,
      collected: false,
      alpha: 1,
    });
  }

  // ---- DRAWING HELPERS ----
  function drawDivineOrb(x, y, size, rotation) {
    ctx.save();
    ctx.translate(x + size/2, y + size/2);
    ctx.rotate(rotation);

    // Main orb
    const grad = ctx.createRadialGradient(-size*0.1, -size*0.15, size*0.05, 0, 0, size/2);
    grad.addColorStop(0, '#f5d060');
    grad.addColorStop(0.5, '#e89030');
    grad.addColorStop(1, '#c87020');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, size/2, 0, Math.PI * 2);
    ctx.fill();

    // Glow
    ctx.shadowColor = 'rgba(232, 144, 48, 0.5)';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-size*0.1, -size*0.15, size*0.15, size*0.1, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawExaltOrb(x, y, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const grad = ctx.createRadialGradient(x - 2, y - 3, 1, x, y, size/2);
    grad.addColorStop(0, '#ffe880');
    grad.addColorStop(0.6, '#c4a44a');
    grad.addColorStop(1, '#8a7030');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, size/2, 0, Math.PI * 2);
    ctx.fill();

    // Star shape on it
    ctx.fillStyle = 'rgba(255,255,220,0.5)';
    ctx.font = `${size * 0.7}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✦', x, y + 1);

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawFrank() {
    const f = frank;
    const spriteImg = sprites[f.sprite];
    if (!spriteImg) return;

    ctx.save();

    // Waddle when running
    let drawY = f.y;
    let drawRotation = 0;
    if (f.grounded && state === 'playing') {
      f.waddlePhase += 0.25;
      drawY += Math.sin(f.waddlePhase * 2) * 3;
      drawRotation = Math.sin(f.waddlePhase) * 0.06;
    }

    // Hit shake
    if (state === 'gameover' && shakeTimer > 0) {
      drawRotation = (Math.random() - 0.5) * 0.15;
    }

    ctx.translate(f.x + FRANK_W/2, drawY + FRANK_H/2);
    ctx.rotate(drawRotation);
    ctx.scale(-1, 1); // Flip to face right
    ctx.drawImage(spriteImg, -FRANK_W/2, -FRANK_H/2, FRANK_W, FRANK_H);
    ctx.restore();
  }

  function drawGround() {
    // Ground body - subtle gradient
    const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    groundGrad.addColorStop(0, '#2a1f12');
    groundGrad.addColorStop(0.3, '#221a0f');
    groundGrad.addColorStop(1, '#1a140c');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    // Top edge with glow
    ctx.strokeStyle = '#4a3520';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();

    // Subtle horizon glow
    ctx.save();
    const edgeGlow = ctx.createLinearGradient(0, GROUND_Y - 3, 0, GROUND_Y + 8);
    edgeGlow.addColorStop(0, 'rgba(232, 166, 48, 0)');
    edgeGlow.addColorStop(0.5, 'rgba(232, 166, 48, 0.04)');
    edgeGlow.addColorStop(1, 'rgba(232, 166, 48, 0)');
    ctx.fillStyle = edgeGlow;
    ctx.fillRect(0, GROUND_Y - 3, W, 11);
    ctx.restore();

    // Ground details - tiles and rocks
    groundTiles.forEach(t => {
      if (t.isRock) {
        ctx.fillStyle = `rgba(60, 45, 28, ${t.alpha})`;
        ctx.beginPath();
        ctx.ellipse(t.x + t.w/2, t.y + t.h/2, t.w/2, t.h/2, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = `rgba(18, 14, 8, ${t.alpha})`;
        ctx.fillRect(t.x, t.y, t.w, t.h);
      }
    });
  }

  function drawBg() {
    // Sky gradient - richer
    const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    skyGrad.addColorStop(0, '#080706');
    skyGrad.addColorStop(0.4, '#0a0908');
    skyGrad.addColorStop(0.7, '#100e0a');
    skyGrad.addColorStop(1, '#181410');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, GROUND_Y);

    // Subtle ambient glow at horizon center
    ctx.save();
    const horizonGlow = ctx.createRadialGradient(W/2, GROUND_Y, 20, W/2, GROUND_Y, 300);
    horizonGlow.addColorStop(0, 'rgba(232, 166, 48, 0.06)');
    horizonGlow.addColorStop(0.5, 'rgba(232, 130, 30, 0.02)');
    horizonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = horizonGlow;
    ctx.fillRect(0, GROUND_Y - 200, W, 200);
    ctx.restore();

    // Twinkling stars
    bgStars.forEach(s => {
      s.twinklePhase += s.twinkleSpeed;
      const twinkle = s.alpha * (0.6 + 0.4 * Math.sin(s.twinklePhase));
      ctx.fillStyle = `rgba(232, 186, 80, ${twinkle})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Mountain layers (far to near)
    bgMountains.forEach(layer => {
      ctx.fillStyle = layer.color;
      ctx.beginPath();
      ctx.moveTo(-10, GROUND_Y + 2);
      const segW = (W + 200) / (layer.peaks.length - 1);
      for (let i = 0; i < layer.peaks.length; i++) {
        const px = layer.peaks[i].xOff + layer.scrollX;
        const wrappedX = ((px % (W + 200)) + (W + 200)) % (W + 200) - 100;
        const py = layer.y - layer.peaks[i].h;
        if (i === 0) {
          ctx.lineTo(wrappedX, py);
        } else {
          const prevPx = ((layer.peaks[i-1].xOff + layer.scrollX) % (W + 200) + (W + 200)) % (W + 200) - 100;
          const cpx = (prevPx + wrappedX) / 2;
          ctx.quadraticCurveTo(cpx, py - 5, wrappedX, py);
        }
      }
      ctx.lineTo(W + 10, GROUND_Y + 2);
      ctx.closePath();
      ctx.fill();
    });

    // Floating dust/embers
    bgDust.forEach(d => {
      d.phase += 0.02;
      const yOff = Math.sin(d.phase) * 8;
      ctx.save();
      ctx.globalAlpha = d.alpha * (0.5 + 0.5 * Math.sin(d.phase * 1.5));
      ctx.fillStyle = '#e8a630';
      ctx.beginPath();
      ctx.arc(d.x, d.y + yOff, d.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  // Vignette drawn once per frame over everything
  function drawVignette() {
    // Top/bottom vignette
    const vTop = ctx.createLinearGradient(0, 0, 0, 40);
    vTop.addColorStop(0, 'rgba(6, 5, 4, 0.5)');
    vTop.addColorStop(1, 'rgba(6, 5, 4, 0)');
    ctx.fillStyle = vTop;
    ctx.fillRect(0, 0, W, 40);

    // Corners
    const vLeft = ctx.createLinearGradient(0, 0, 50, 0);
    vLeft.addColorStop(0, 'rgba(6, 5, 4, 0.3)');
    vLeft.addColorStop(1, 'rgba(6, 5, 4, 0)');
    ctx.fillStyle = vLeft;
    ctx.fillRect(0, 0, 50, H);

    const vRight = ctx.createLinearGradient(W, 0, W - 50, 0);
    vRight.addColorStop(0, 'rgba(6, 5, 4, 0.3)');
    vRight.addColorStop(1, 'rgba(6, 5, 4, 0)');
    ctx.fillStyle = vRight;
    ctx.fillRect(W - 50, 0, 50, H);
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 1) * 5,
        size: Math.random() * 3 + 1,
        alpha: 1,
        color,
        life: 30 + Math.random() * 20,
      });
    }
  }

  // ---- UPDATE ----
  function update() {
    frameCount++;

    if (state !== 'playing') return;

    // Speed ramp
    distance += speed * 0.1;
    score = Math.floor(distance);
    difficultyLevel = Math.floor(distance / 100);
    speed = 4 + difficultyLevel * 0.4;
    if (speed > 12) speed = 12;

    // Milestones
    const milestone = Math.floor(score / 100) * 100;
    if (milestone > lastMilestone && milestone > 0) {
      lastMilestone = milestone;
      playSound('milestone');
    }

    // Frank physics
    if (!frank.grounded) {
      frank.vy += GRAVITY;
      frank.y += frank.vy;
      if (frank.y >= GROUND_Y - FRANK_H) {
        frank.y = GROUND_Y - FRANK_H;
        frank.vy = 0;
        frank.grounded = true;
        frank.sprite = 'run';
        // Land dust
        spawnParticles(frank.x + FRANK_W/2, GROUND_Y, '#4a3520', 4);
      }
    }

    // Running dust trail
    if (frank.grounded && frameCount % 6 === 0) {
      particles.push({
        x: frank.x + 5,
        y: GROUND_Y - 2,
        vx: -speed * 0.3 + (Math.random() - 0.5) * 0.5,
        vy: -(Math.random() * 1.5),
        size: Math.random() * 2 + 1,
        alpha: 0.3,
        color: '#3a2a18',
        life: 15 + Math.random() * 10,
      });
    }

    // Spawn obstacles
    spawnTimer -= speed * 0.1;
    if (spawnTimer <= 0) {
      spawnObstacle();
      // Min gap decreases with difficulty
      const minGap = Math.max(25, 50 - difficultyLevel * 3);
      const maxGap = Math.max(45, 80 - difficultyLevel * 3);
      spawnTimer = minGap + Math.random() * (maxGap - minGap);
    }

    // Spawn collectibles
    collectibleTimer -= speed * 0.1;
    if (collectibleTimer <= 0) {
      if (Math.random() < 0.4) spawnCollectible();
      collectibleTimer = 30 + Math.random() * 40;
    }

    // Move obstacles
    obstacles.forEach(o => {
      o.x -= speed;
      o.rotation += o.rotSpeed;
    });
    obstacles = obstacles.filter(o => o.x > -50);

    // Move collectibles
    collectibles.forEach(c => {
      c.x -= speed;
      c.bobPhase += 0.08;
      if (c.collected) {
        c.alpha -= 0.05;
        c.y -= 2;
      }
    });
    collectibles = collectibles.filter(c => c.x > -30 && c.alpha > 0);

    // Move bg
    bgStars.forEach(s => {
      s.x -= speed * s.speed;
      if (s.x < -5) s.x = W + 5;
    });
    bgDust.forEach(d => {
      d.x -= speed * d.speedX;
      if (d.x < -10) { d.x = W + 10; d.y = Math.random() * (GROUND_Y - 30); }
    });
    bgMountains.forEach(layer => {
      layer.scrollX -= speed * layer.speed;
    });
    groundTiles.forEach(t => {
      t.x -= speed * t.speed;
      if (t.x < -50) t.x = W + Math.random() * 100;
    });

    // Particles
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life--;
      p.alpha = Math.max(0, p.life / 40);
    });
    particles = particles.filter(p => p.life > 0);

    // Collision with obstacles
    const fHitbox = {
      x: frank.x + 10,
      y: frank.y + 8,
      w: FRANK_W - 20,
      h: FRANK_H - 12,
    };
    for (const o of obstacles) {
      const oHitbox = {
        x: o.x + 4,
        y: o.y + 4,
        w: o.w - 8,
        h: o.h - 8,
      };
      if (fHitbox.x < oHitbox.x + oHitbox.w &&
          fHitbox.x + fHitbox.w > oHitbox.x &&
          fHitbox.y < oHitbox.y + oHitbox.h &&
          fHitbox.y + fHitbox.h > oHitbox.y) {
        gameOver();
        return;
      }
    }

    // Collect exalts
    for (const c of collectibles) {
      if (c.collected) continue;
      const dist = Math.hypot(
        (frank.x + FRANK_W/2) - (c.x + c.w/2),
        (frank.y + FRANK_H/2) - (c.y + c.w/2 + Math.sin(c.bobPhase) * 6)
      );
      if (dist < 35) {
        c.collected = true;
        exaltCount++;
        score += 25;
        playSound('collect');
        spawnParticles(c.x + c.w/2, c.y, '#ffe880', 6);
      }
    }

    // HUD
    document.getElementById('hud-score').textContent = score;
    document.getElementById('hud-high').textContent = `HI ${highScore}`;
    document.getElementById('hud-exalts').textContent = `✦ ${exaltCount}`;
  }

  // ---- RENDER ----
  function render() {
    ctx.clearRect(0, 0, W, H);

    // Screen shake
    ctx.save();
    if (shakeTimer > 0) {
      shakeTimer--;
      const sx = (Math.random() - 0.5) * shakeIntensity;
      const sy = (Math.random() - 0.5) * shakeIntensity;
      ctx.translate(sx, sy);
      shakeIntensity *= 0.9;
    }

    drawBg();
    drawGround();

    // Obstacles
    obstacles.forEach(o => {
      drawDivineOrb(o.x, o.y, o.w, o.rotation);
    });

    // Collectibles
    collectibles.forEach(c => {
      const bobY = c.y + Math.sin(c.bobPhase) * 6;
      drawExaltOrb(c.x + c.w/2, bobY + c.h/2, c.w, c.alpha);
    });

    drawParticles();
    drawFrank();

    ctx.restore();

    // Vignette on top of everything
    drawVignette();
  }

  // ---- GAME FLOW ----
  function gameOver() {
    state = 'gameover';
    frank.sprite = 'hit';
    shakeTimer = 20;
    shakeIntensity = 8;
    playSound('hit');

    const isNewBest = score > highScore;
    if (isNewBest) {
      highScore = score;
      localStorage.setItem('frankrun_hi', String(highScore));
      if (typeof plausible !== 'undefined') plausible('New+High+Score', {props: {score: score}});
    }
    if (typeof plausible !== 'undefined') plausible('Game+Over', {props: {score: score, distance: Math.floor(distance), exalts: exaltCount}});

    document.getElementById('hud').style.display = 'none';
    document.getElementById('final-score').textContent = score;
    document.getElementById('stat-distance').textContent = Math.floor(distance);
    document.getElementById('stat-exalts').textContent = exaltCount;
    document.getElementById('stat-best').textContent = highScore;
    document.getElementById('new-best').classList.toggle('show', isNewBest);
    document.getElementById('gameover-screen').classList.add('active');
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    if (typeof plausible !== 'undefined') plausible('Game+Start');
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('gameover-screen').classList.remove('active');
    document.getElementById('hud').style.display = 'block';
  }

  function jump() {
    if (state === 'start' || state === 'gameover') {
      startGame();
      return;
    }
    if (state === 'playing' && frank.grounded) {
      frank.vy = JUMP_FORCE;
      frank.grounded = false;
      frank.sprite = 'jump';
      playSound('jump');
      spawnParticles(frank.x + FRANK_W/2, GROUND_Y, '#4a3520', 3);
    }
  }

  // ---- INPUT ----
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });

  // Touch/tap
  let touchStartY = null;
  document.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchStartY = e.touches[0].clientY;
    jump();
  }, { passive: false });

  // Swipe up for jump (mobile)
  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  // Mouse click
  canvas.addEventListener('mousedown', (e) => {
    jump();
  });

  // ---- GAME LOOP ----
  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // Wait for sprites then start loop
  function waitAndStart() {
    if (spritesLoaded >= spriteTotal) {
      initBg();
      // Draw initial frame with frank standing
      frank = {
        x: FRANK_X,
        y: GROUND_Y - FRANK_H,
        vy: 0,
        grounded: true,
        sprite: 'run',
        waddlePhase: 0,
      };
      loop();
    } else {
      setTimeout(waitAndStart, 50);
    }
  }
  waitAndStart();

})();
</script>
</body>
</html>
