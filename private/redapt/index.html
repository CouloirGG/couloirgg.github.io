<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDAPT - Visual Library - April 21</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--lime:#A7DB78;--lime-dark:#6a9c2a;--teal:#005770;--teal-dark:#003E47;--teal-pale:#e0eef2;--bg-dark:#0a1a20;--bg-light:#f5f7fa;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--dim:rgba(255,255,255,0.5);--faint:rgba(255,255,255,0.22);--charcoal:#1e293b;--red:#ef4444;--amber:#f59e0b;--orange:#f97316;--blue:#4ac0ff;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}body{font-family:'Sora',sans-serif;}
.master-header{background:var(--teal-dark);padding:14px 40px;position:sticky;top:0;z-index:1000;border-bottom:2px solid var(--lime);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.mh-brand{font-size:14px;font-weight:800;color:white;letter-spacing:-0.02em;}
.mh-brand span{color:var(--lime);}
.mh-sub{font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px;letter-spacing:0.04em;}
.nav-pills{display:flex;gap:6px;flex-wrap:wrap;}
.nav-pill{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.55);text-decoration:none;transition:all 0.2s;}
.nav-pill:hover{border-color:rgba(167,219,120,0.35);color:var(--lime);background:rgba(167,219,120,0.07);}
.nav-pill.active{background:var(--lime);color:var(--teal-dark);border-color:var(--lime);}
.np-num{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:0.7;}
.visual-section{position:relative;}
.section-header{display:flex;align-items:center;gap:14px;padding:18px 40px 0;}
.sh-num{font-size:11px;font-weight:700;letter-spacing:0.15em;font-family:'JetBrains Mono',monospace;color:var(--lime);background:rgba(167,219,120,0.1);border:1px solid rgba(167,219,120,0.2);padding:4px 10px;border-radius:20px;}
.sh-label{font-size:13px;font-weight:700;letter-spacing:0.02em;}
#path,#telephone,#choice{background:var(--bg-dark);}
#path .sh-label,#telephone .sh-label,#choice .sh-label{color:rgba(255,255,255,0.35);}
#stands{background:#f5f7fa;}#stands .section-header{border-top:1px solid #e2e8f0;}#stands .sh-label{color:#94a3b8;}
.visual-section+.visual-section{border-top:2px solid rgba(167,219,120,0.15);}

/* == 01: The Obvious Path == */

#path .main { padding: 56px 40px; display: flex; flex-direction: column; align-items: center; gap: 48px; }
h1 { font-size: clamp(26px, 4vw, 46px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.07; margin-bottom: 16px; color: white; }
h1 em { color: var(--lime); font-style: normal; }
h2 { font-size: clamp(22px, 3vw, 36px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.07; margin-bottom: 10px; color: white; }
.title-block { text-align: center; max-width: 680px; }
.eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; }
.subtitle { font-size: 14px; color: var(--dim); font-weight: 300; line-height: 1.8; max-width: 560px; margin: 0 auto; }

.industry-tabs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ind-tab { padding: 9px 20px; border-radius: 30px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 600; color: var(--faint); cursor: pointer; transition: all 0.3s; background: transparent; font-family: 'Sora', sans-serif; display: flex; align-items: center; gap: 8px; }
.ind-tab:hover { border-color: rgba(167,219,120,0.3); color: rgba(255,255,255,0.7); }
.ind-tab.active { border-color: var(--lime); color: var(--lime); background: rgba(167,219,120,0.08); }

.chain-wrap { width: 100%; max-width: 960px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 36px 40px; position: relative; overflow: hidden; }
.chain-wrap::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--teal), var(--lime)); }
.chain-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--faint); font-family: 'JetBrains Mono', monospace; margin-bottom: 28px; }

.steps { display: flex; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; gap: 0; }
.step { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; width: 130px; gap: 10px; }
.step-orb { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid var(--border); background: rgba(255,255,255,0.03); transition: all 0.5s ease; }
.step.lit .step-orb { border-color: rgba(167,219,120,0.5); background: rgba(167,219,120,0.08); box-shadow: 0 0 20px rgba(167,219,120,0.12); }
.step.warn .step-orb { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.08); box-shadow: 0 0 20px rgba(245,158,11,0.12); }
.step.crack .step-orb { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.06); animation: crack-pulse 2.5s infinite; }
@keyframes crack-pulse { 0%,100% { box-shadow: 0 0 20px rgba(239,68,68,0.12); } 50% { box-shadow: 0 0 28px rgba(239,68,68,0.25); } }

.step-title { font-size: 12px; font-weight: 700; text-align: center; color: var(--faint); transition: color 0.5s; line-height: 1.35; }
.step.lit .step-title { color: rgba(255,255,255,0.9); }
.step.warn .step-title { color: #fcd34d; }
.step.crack .step-title { color: #fca5a5; }
.step-note { font-size: 10px; color: var(--faint); text-align: center; line-height: 1.5; max-width: 110px; font-family: 'JetBrains Mono', monospace; transition: color 0.5s; }
.step.crack .step-note { color: rgba(239,68,68,0.7); }

.connector { flex-shrink: 0; width: 44px; display: flex; flex-direction: column; align-items: center; margin-top: 27px; position: relative; }
.conn-line { width: 100%; height: 2px; border-radius: 1px; background: var(--border); transition: background 0.5s; }
.connector.ok .conn-line { background: rgba(167,219,120,0.25); }
.connector.warn .conn-line { background: rgba(245,158,11,0.3); }
.connector.crack .conn-line { background: rgba(239,68,68,0.3); }
.pkt { position: absolute; top: -3px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 5px rgba(167,219,120,0.5); animation: pkt-travel 2.2s infinite; }
.pkt.d2 { animation-delay: 1.1s; }
.pkt.stall { background: var(--amber); box-shadow: 0 0 5px rgba(245,158,11,0.5); animation: pkt-stall 2.5s infinite; }
@keyframes pkt-travel { 0% { left:0; opacity:0; } 15% { opacity:1; } 85% { opacity:1; } 100% { left:36px; opacity:0; } }
@keyframes pkt-stall { 0% { left:0; opacity:0; } 15% { opacity:1; } 50% { left:18px; opacity:1; } 65% { opacity:0.3; } 80% { opacity:0; } 100% { left:0; opacity:0; } }

.compound-row { display: flex; gap: 14px; width: 100%; max-width: 960px; flex-wrap: wrap; }
.compound-card { flex: 1; min-width: 200px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 18px; position: relative; overflow: hidden; opacity: 0; transform: translateY(12px); transition: opacity 0.5s ease, transform 0.5s ease; }
.compound-card.visible { opacity: 1; transform: translateY(0); }
.compound-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.compound-card:nth-child(1)::before { background: rgba(167,219,120,0.5); }
.compound-card:nth-child(2)::before { background: rgba(245,158,11,0.6); }
.compound-card:nth-child(3)::before { background: rgba(239,68,68,0.6); }
.compound-step { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 8px; }
.compound-step.s1 { color: rgba(167,219,120,0.7); }
.compound-step.s2 { color: rgba(245,158,11,0.8); }
.compound-step.s3 { color: rgba(239,68,68,0.8); }
.compound-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.01em; }
.compound-body { font-size: 11px; color: var(--faint); line-height: 1.6; font-weight: 300; }

.bottom-note { max-width: 640px; text-align: center; background: rgba(167,219,120,0.05); border: 1px solid rgba(167,219,120,0.15); border-radius: 12px; padding: 24px 32px; }
.bottom-note p { font-size: 14px; color: var(--dim); line-height: 1.8; font-weight: 300; }
.bottom-note strong { color: var(--lime); font-weight: 600; }

/* == 02: The Telephone Effect == */

#telephone .main { padding: 48px 20px; display: flex; flex-direction: column; align-items: center; gap: 0; }
@media (min-width:640px) { #telephone .main { padding: 48px 40px; } }

/* ── PANEL HEADERS ── */
.panel-intro { width: 100%; max-width: 960px; padding-bottom: 36px; }
.panel-intro.second { padding-top: 64px; padding-bottom: 36px; border-top: 2px solid rgba(255,255,255,0.06); margin-top: 64px; }
.panel-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 10px; }
.panel-intro:first-child .panel-tag { color: var(--lime); }
.panel-intro.second .panel-tag { color: #a78bfa; }
h2 { font-size: clamp(22px, 3vw, 36px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.07; margin-bottom: 10px; }
h2 em { font-style: normal; }
.panel-intro:first-child h2 em { color: var(--amber); }
.panel-intro.second h2 em { color: #a78bfa; }
.panel-sub { font-size: 13px; color: var(--dim); font-weight: 300; line-height: 1.8; max-width: 620px; }

/* ── PANEL A: SPREAD CANVAS ── */
.spread-wrap {
  width: 100%; max-width: 960px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden; position: relative;
}
.spread-wrap::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--lime), var(--amber), var(--orange)); z-index: 2; }
#spread-canvas { display: block; width: 100%; min-height: 360px; }
.replay-btn { position: absolute; bottom: 14px; right: 14px; z-index: 10; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.03); cursor: pointer; font-family: 'Sora', sans-serif; transition: all 0.2s; }
.replay-btn:hover { border-color: var(--lime); color: var(--lime); }

/* ── SPREAD SCROLL TIMELINE ── */
.spread-timeline {
  width: 100%; padding: 16px 20px 20px;
  background: rgba(0,0,0,0.15);
  border-top: 1px solid var(--border);
  position: relative;
}
.stl-track {
  position: relative; height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px; margin-bottom: 20px;
}
.stl-fill {
  position: absolute; top: 0; left: 0; height: 100%;
  background: linear-gradient(90deg, var(--lime), var(--amber), var(--orange), var(--red));
  border-radius: 2px; width: 0%;
  transition: width 0.3s ease;
}
.stl-cursor {
  position: absolute; top: -5px;
  width: 14px; height: 14px; border-radius: 50%;
  background: white; border: 2px solid var(--lime);
  transform: translateX(-50%);
  transition: left 0.3s ease, border-color 0.5s;
  box-shadow: 0 0 8px rgba(167,219,120,0.4);
}
.stl-stops {
  display: flex; justify-content: space-between;
  position: relative;
}
.stl-stop {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  flex: 1; opacity: 0.3; transition: opacity 0.4s;
}
.stl-stop.active { opacity: 1; }
.stl-stop-dot {
  width: 7px; height: 7px; border-radius: 50%;
  border: 1.5px solid; background: transparent;
  transition: background 0.4s;
}
.stl-stop.active .stl-stop-dot { background: currentColor; }
.stl-stop:nth-child(1) { color: var(--lime); }
.stl-stop:nth-child(2) { color: var(--amber); }
.stl-stop:nth-child(3) { color: var(--orange); }
.stl-stop:nth-child(4) { color: var(--red); }
.stl-stop-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
  text-align: center; color: inherit;
}
.stl-stop-sub {
  font-size: 9px; color: var(--faint); font-weight: 300;
  text-align: center; line-height: 1.3; max-width: 80px;
}

/* speech bubble appearing near nodes */
.bubble-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.speech-bubble { position: absolute; background: rgba(10,26,32,0.92); border: 1px solid; border-radius: 8px; padding: 6px 10px; font-size: 10px; line-height: 1.4; max-width: 160px; opacity: 0; transition: opacity 0.4s; font-family: 'JetBrains Mono', monospace; }
.speech-bubble.show { opacity: 1; }
.speech-bubble::after { content: ''; position: absolute; bottom: -6px; left: 12px; width: 10px; height: 6px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.speech-bubble.intact { border-color: rgba(167,219,120,0.4); color: var(--lime); }
.speech-bubble.intact::after { background: rgba(167,219,120,0.4); }
.speech-bubble.degraded { border-color: rgba(245,158,11,0.4); color: #fcd34d; }
.speech-bubble.degraded::after { background: rgba(245,158,11,0.4); }
.speech-bubble.bad { border-color: rgba(249,115,22,0.4); color: #fdba74; }
.speech-bubble.bad::after { background: rgba(249,115,22,0.4); }

/* ── PANEL B: SEDIMENT ── */
.sediment-wrap { width: 100%; max-width: 960px; }

/* Timeline row */
.timeline { display: flex; gap: 0; align-items: stretch; position: relative; margin-bottom: 32px; }
.timeline::before { content: ''; position: absolute; top: 28px; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, rgba(167,219,120,0.3), rgba(167,35,35,0.4)); z-index: 0; }

.tl-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 1; }
.tl-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid; position: relative; z-index: 2; transition: all 0.5s; }
.tl-col:nth-child(1) .tl-dot { background: rgba(167,219,120,0.3); border-color: var(--lime); }
.tl-col:nth-child(2) .tl-dot { background: rgba(245,158,11,0.3); border-color: var(--amber); }
.tl-col:nth-child(3) .tl-dot { background: rgba(249,115,22,0.3); border-color: var(--orange); }
.tl-col:nth-child(4) .tl-dot { background: rgba(239,68,68,0.3); border-color: var(--red); }
.tl-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
.tl-col:nth-child(1) .tl-label { color: var(--lime); }
.tl-col:nth-child(2) .tl-label { color: var(--amber); }
.tl-col:nth-child(3) .tl-label { color: var(--orange); }
.tl-col:nth-child(4) .tl-label { color: var(--red); }

/* Sediment layers */
.layers-wrap { position: relative; margin-bottom: 40px; }
.layer {
  width: 100%; border-radius: 10px; padding: 14px 20px;
  margin-bottom: 6px; display: flex; align-items: flex-start; gap: 14px;
  border: 1px solid; transition: all 0.5s;
  opacity: 0; transform: translateY(6px);
}
.layer.show { opacity: 1; transform: translateY(0); }
.layer-year { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; width: 60px; margin-top: 2px; }
.layer-content { flex: 1; }
.layer-belief { font-size: 12px; font-weight: 500; line-height: 1.5; margin-bottom: 4px; }
.layer-origin { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--faint); line-height: 1.4; }
.layer-solidity { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.solidity-bar { height: 3px; border-radius: 2px; transition: width 0.8s ease; }
.solidity-label { font-size: 9px; color: var(--faint); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }

/* Year 1 - fresh, faint */
.layer.y1 { background: rgba(167,219,120,0.04); border-color: rgba(167,219,120,0.15); }
.layer.y1 .layer-year { color: var(--lime); }
.layer.y1 .layer-belief { color: rgba(255,255,255,0.7); }
.layer.y1 .solidity-bar { width: 15%; background: var(--lime); }

/* Year 2 - solidifying */
.layer.y2 { background: rgba(245,158,11,0.04); border-color: rgba(245,158,11,0.2); }
.layer.y2 .layer-year { color: var(--amber); }
.layer.y2 .layer-belief { color: rgba(255,255,255,0.8); }
.layer.y2 .solidity-bar { width: 40%; background: var(--amber); }

/* Year 3 - hardening */
.layer.y3 { background: rgba(249,115,22,0.05); border-color: rgba(249,115,22,0.25); }
.layer.y3 .layer-year { color: var(--orange); }
.layer.y3 .layer-belief { color: rgba(255,255,255,0.88); font-weight: 600; }
.layer.y3 .solidity-bar { width: 72%; background: var(--orange); }

/* Year 4+ - concrete */
.layer.y4 { background: rgba(239,68,68,0.06); border-color: rgba(239,68,68,0.3); }
.layer.y4 .layer-year { color: var(--red); }
.layer.y4 .layer-belief { color: white; font-weight: 700; font-size: 13px; }
.layer.y4 .solidity-bar { width: 100%; background: var(--red); }

/* ── DINOSAUR ROW ── */
.dino-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
@media (min-width: 640px) { .dino-row { grid-template-columns: repeat(4,1fr); gap: 14px; } }
.person-card { width: 100%; overflow: hidden; min-width: 0; background: var(--card); border: 1.5px solid; border-radius: 12px; padding: 18px 16px; position: relative; overflow: hidden; opacity: 0; transform: translateY(8px); transition: all 0.5s; }
.person-card.show { opacity: 1; transform: translateY(0); }

.person-card.dino { border-color: rgba(239,68,68,0.25); }
.person-card.dino::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--red); }
.person-card.newjoin { border-color: rgba(167,219,120,0.2); }
.person-card.newjoin::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--lime); }

.pc-avatar { font-size: 28px; margin-bottom: 8px; display: block; }
.pc-tenure { font-size: 8px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; word-break: break-word; overflow-wrap: break-word; white-space: normal; }
.person-card.dino .pc-tenure { color: rgba(239,68,68,0.7); }
.person-card.newjoin .pc-tenure { color: rgba(167,219,120,0.7); }
.pc-name { font-size: 12px; font-weight: 700; margin-bottom: 4px; word-break: break-word; overflow-wrap: break-word; line-height: 1.3; }
.pc-belief { font-size: 11px; color: var(--faint); line-height: 1.55; font-weight: 300; font-style: italic; word-break: break-word; overflow-wrap: break-word; }
.pc-source { font-size: 9px; font-family: 'JetBrains Mono', monospace; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); word-break: break-word; overflow-wrap: break-word; line-height: 1.5; }
.person-card.dino .pc-source { color: rgba(239,68,68,0.5); }
.person-card.newjoin .pc-source { color: rgba(167,219,120,0.5); }

/* influence radius badge */
.influence-badge { position: static; display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-bottom: 8px; }
.person-card.dino .influence-badge { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
.person-card.newjoin .influence-badge { background: rgba(167,219,120,0.08); color: var(--lime); border: 1px solid rgba(167,219,120,0.15); }

/* ── TRUTH BURIED ── */
.truth-block { width: 100%; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; position: relative; overflow: hidden; opacity: 0; transition: opacity 0.6s; }
.truth-block.show { opacity: 1; }
.truth-block::before { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, rgba(167,219,120,0.4), rgba(167,219,120,0.1)); }
.truth-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; color: var(--lime); margin-bottom: 8px; }
.truth-text { font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.65; font-style: italic; text-decoration: line-through; text-decoration-color: rgba(239,68,68,0.4); }
.truth-note { font-size: 11px; color: var(--faint); margin-top: 10px; line-height: 1.6; font-weight: 300; }
.truth-note strong { color: rgba(239,68,68,0.8); font-weight: 600; }

/* ── BOTTOM LINE ── */
.bottom-line { width: 100%; max-width: 960px; text-align: center; padding: 40px 0 0; }
.bottom-line-text { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: rgba(255,255,255,0.35); line-height: 1.5; }
.bottom-line-text em { color: rgba(255,255,255,0.7); font-style: normal; }

/* == 03: The Choice Point == */

#choice .main { padding: 56px 40px; display: flex; flex-direction: column; align-items: center; gap: 44px; }
#choice .title-block { text-align: center; max-width: 640px; }
#choice h1 { font-size: clamp(26px, 4vw, 44px); margin-bottom: 14px; }
#choice h1 em { color: var(--amber); font-style: normal; }
#choice .subtitle { max-width: 520px; }

/* SCENARIO TABS */
.scenario-tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.stab { padding: 8px 16px; border-radius: 24px; border: 1.5px solid var(--border); font-size: 11px; font-weight: 600; color: var(--faint); cursor: pointer; transition: all 0.25s; background: transparent; font-family: 'Sora', sans-serif; }
.stab:hover { border-color: rgba(245,158,11,0.3); color: rgba(255,255,255,0.7); }
.stab.active { border-color: var(--amber); color: #fcd34d; background: rgba(245,158,11,0.07); }

/* FORK */
.fork-outer { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; }
.fork-ctx { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; align-items: flex-start; gap: 12px; }
.fork-ctx-icon { font-size: 20px; flex-shrink: 0; }
.fork-ctx-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-family: 'JetBrains Mono', monospace; margin-bottom: 4px; }
.fork-ctx-text { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 300; line-height: 1.6; }

.fork-options { display: flex; gap: 12px; flex-wrap: wrap; }
.opt { flex: 1; min-width: 240px; border-radius: 12px; border: 1.5px solid; padding: 20px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
.opt::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.opt.easy { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.04); }
.opt.easy::before { background: var(--amber); }
.opt.easy:hover, .opt.easy.sel { border-color: rgba(245,158,11,0.55); background: rgba(245,158,11,0.08); }
.opt.hard { border-color: var(--border); background: var(--card); }
.opt.hard::before { background: rgba(167,219,120,0.5); }
.opt.hard:hover, .opt.hard.sel { border-color: rgba(167,219,120,0.35); background: rgba(167,219,120,0.05); }

.opt-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; margin-bottom: 10px; display: inline-block; }
.opt-tag.easy { background: rgba(245,158,11,0.12); color: #fcd34d; border: 1px solid rgba(245,158,11,0.25); }
.opt-tag.hard { background: rgba(167,219,120,0.08); color: var(--lime); border: 1px solid rgba(167,219,120,0.2); }
.opt-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.01em; }
.opt-title.easy { color: #fcd34d; }
.opt-title.hard { color: rgba(255,255,255,0.85); }
.opt-desc { font-size: 11px; color: var(--faint); line-height: 1.6; font-weight: 300; margin-bottom: 12px; }
.opt-friction { display: flex; align-items: center; gap: 7px; }
.fric-label { font-size: 10px; color: var(--faint); font-family: 'JetBrains Mono', monospace; }
.fdots { display: flex; gap: 3px; }
.fd { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
.fd.e { background: var(--amber); }
.fd.h { background: var(--lime); }
.opt-result { font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 8px 10px; border-radius: 7px; margin-top: 12px; opacity: 0; transition: opacity 0.3s; line-height: 1.5; }
.opt.sel .opt-result { opacity: 1; }
.opt-result.easy { background: rgba(245,158,11,0.08); color: #fcd34d; border: 1px solid rgba(245,158,11,0.15); }
.opt-result.hard { background: rgba(167,219,120,0.07); color: var(--lime); border: 1px solid rgba(167,219,120,0.15); }

/* TIGHT REASON CARDS */
.reason-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; width: 100%; max-width: 900px; }
.rc { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: all 0.25s; opacity: 0; transform: translateY(8px); position: relative; overflow: hidden; }
.rc.visible { opacity: 1; transform: translateY(0); }
.rc:hover, .rc.open { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.04); }
.rc::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: rgba(245,158,11,0.35); }
.rc-num { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: rgba(245,158,11,0.5); font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
.rc-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.85); margin-bottom: 0; line-height: 1.35; }
.rc-body { font-size: 11px; color: var(--faint); line-height: 1.6; font-weight: 300; max-height: 0; overflow: hidden; transition: max-height 0.35s ease, margin-top 0.25s; }
.rc.open .rc-body { max-height: 100px; margin-top: 7px; }
.rc-hint { font-size: 9px; color: rgba(245,158,11,0.4); font-family: 'JetBrains Mono', monospace; margin-top: 6px; transition: opacity 0.25s; }
.rc.open .rc-hint { opacity: 0; }

.bottom-note { max-width: 660px; text-align: center; background: rgba(167,219,120,0.04); border: 1px solid rgba(167,219,120,0.14); border-radius: 12px; padding: 20px 28px; }
.bottom-note p { font-size: 13px; color: var(--dim); line-height: 1.8; font-weight: 300; }
.bottom-note strong { color: var(--lime); font-weight: 600; }

/* == 04: Where Things Stand == */

#stands { --card: #ffffff; --border: #e2e8f0; --dim: #64748b; --faint: #94a3b8; color: var(--charcoal); }
#stands .main { padding: 56px 40px; display: flex; flex-direction: column; align-items: center; gap: 48px; }
#stands .title-block { text-align: center; max-width: 680px; }
#stands .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; }
#stands h1 { font-size: clamp(26px, 3.5vw, 44px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.07; margin-bottom: 16px; color: var(--charcoal); }
#stands h1 em { color: var(--teal); font-style: normal; }
#stands .subtitle { font-size: 14px; color: var(--dim); font-weight: 300; line-height: 1.8; max-width: 540px; margin: 0 auto; }

/* STAGE SELECTOR */
.stage-wrap { display: flex; gap: 0; border-radius: 12px; border: 1.5px solid var(--border); overflow: hidden; background: var(--card); }
.stage-btn { padding: 12px 28px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s; border: none; background: transparent; font-family: 'Sora', sans-serif; color: var(--faint); border-right: 1px solid var(--border); }
.stage-btn:last-child { border-right: none; }
.stage-btn.active-now { background: #FFFBF0; color: #92400e; }
.stage-btn.active-fix1 { background: var(--teal-pale); color: var(--teal-dark); }
.stage-btn.active-fix2 { background: rgba(167,219,120,0.1); color: var(--lime-dark); }
.stage-btn.active-full { background: var(--teal-dark); color: var(--lime); }

/* MAIN FLOW DIAGRAM */
.flow-diagram { width: 100%; max-width: 1040px; background: var(--card); border: 1.5px solid var(--border); border-radius: 18px; padding: 36px; position: relative; overflow: hidden; }
.flow-diagram::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; transition: background 0.5s; }
.stage-now .flow-diagram::before { background: linear-gradient(90deg, var(--teal), var(--amber), var(--amber)); }
.stage-fix1 .flow-diagram::before { background: linear-gradient(90deg, var(--teal), var(--lime), var(--amber)); }
.stage-fix2 .flow-diagram::before { background: linear-gradient(90deg, var(--teal), var(--lime), var(--lime)); }
.stage-full .flow-diagram::before { background: linear-gradient(90deg, var(--teal), var(--lime)); }

.flow-stage-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 28px; transition: color 0.4s; }

/* Flow nodes */
.flow-nodes { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.fn { flex-shrink: 0; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.fn-box { width: 100%; padding: 12px 10px; border-radius: 10px; border: 1.5px solid; text-align: center; transition: all 0.5s; position: relative; }
.fn-icon { font-size: 20px; margin-bottom: 4px; display: block; }
.fn-title { font-size: 11px; font-weight: 700; line-height: 1.3; }
.fn-note { font-size: 10px; font-family: 'JetBrains Mono', monospace; margin-top: 4px; line-height: 1.4; }

/* Node states */
.fn-box.ok { border-color: rgba(0,87,112,0.18); background: var(--teal-pale); }
.fn-box.ok .fn-title { color: var(--teal-dark); }
.fn-box.ok .fn-note { color: var(--faint); }

.fn-box.crack { border-color: rgba(245,158,11,0.35); background: #FFFBF0; }
.fn-box.crack .fn-title { color: #92400e; }
.fn-box.crack .fn-note { color: #b45309; }

.fn-box.broken { border-color: rgba(239,68,68,0.3); background: #FFF5F5; }
.fn-box.broken .fn-title { color: var(--red); }
.fn-box.broken .fn-note { color: #b91c1c; }

.fn-box.fixed { border-color: rgba(167,219,120,0.45); background: rgba(167,219,120,0.08); }
.fn-box.fixed .fn-title { color: var(--lime-dark); }
.fn-box.fixed .fn-note { color: var(--lime-dark); }

/* crack overlay animation */
.fn-box.crack::after { content: '⚠'; position: absolute; top: -8px; right: -8px; font-size: 14px; background: var(--amber); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; line-height: 20px; text-align: center; }
.fn-box.broken::after { content: '!'; position: absolute; top: -8px; right: -8px; font-size: 12px; background: var(--red); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; line-height: 20px; text-align: center; }
.fn-box.fixed::after { content: '✓'; position: absolute; top: -8px; right: -8px; font-size: 12px; background: var(--lime-dark); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; line-height: 20px; text-align: center; }

/* Connector arrows */
.fc { flex-shrink: 0; width: 40px; display: flex; flex-direction: column; align-items: center; margin-top: 24px; position: relative; }
.fc-line { width: 100%; height: 2px; border-radius: 1px; transition: background 0.5s; }
.fc.ok .fc-line { background: rgba(0,87,112,0.2); }
.fc.crack .fc-line { background: rgba(245,158,11,0.4); }
.fc.broken .fc-line { background: rgba(239,68,68,0.3); }
.fc.fixed .fc-line { background: rgba(167,219,120,0.4); }

/* animated packets on connectors */
.fpkt { position: absolute; top: -4px; left: 0; width: 10px; height: 10px; border-radius: 50%; animation: fpkt-go 2s infinite; }
.fpkt.ok { background: rgba(0,87,112,0.5); animation: fpkt-go 2s infinite; }
.fpkt.crack { background: var(--amber); animation: fpkt-stall 2.2s infinite; }
.fpkt.broken { background: var(--red); animation: fpkt-stop 2s infinite; }
.fpkt.fixed { background: var(--lime); animation: fpkt-go 1.8s infinite; box-shadow: 0 0 6px rgba(167,219,120,0.4); }
.fpkt.d2 { animation-delay: 1s; }
@keyframes fpkt-go { 0%{left:0;opacity:0} 15%{opacity:1} 85%{opacity:1} 100%{left:30px;opacity:0} }
@keyframes fpkt-stall { 0%{left:0;opacity:0} 15%{opacity:1} 55%{left:16px;opacity:1} 70%{opacity:0.3} 85%{opacity:0} 100%{left:0;opacity:0} }
@keyframes fpkt-stop { 0%{left:0;opacity:0} 15%{opacity:1} 40%{left:10px;opacity:1} 55%{opacity:0} 100%{left:0;opacity:0} }

/* WHAT CHANGED */
.changes-wrap { width: 100%; max-width: 1040px; }
.changes-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-family: 'JetBrains Mono', monospace; margin-bottom: 16px; }
.changes-list { display: flex; flex-direction: column; gap: 10px; }
.change-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 18px; border-radius: 10px; border: 1.5px solid; opacity: 0; transform: translateX(-10px); transition: all 0.4s ease; }
.change-item.show { opacity: 1; transform: translateX(0); }
.change-item.pending { border-color: var(--border); background: #f8fafc; }
.change-item.done { border-color: rgba(167,219,120,0.35); background: rgba(167,219,120,0.05); }
.change-item.fixing { border-color: rgba(245,158,11,0.3); background: #FFFBF0; }
.change-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; margin-top: 1px; }
.change-dot.done { background: var(--lime-dark); color: white; }
.change-dot.fixing { background: var(--amber); color: white; }
.change-dot.pending { background: var(--border); color: var(--faint); }
.change-body-title { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.change-item.done .change-body-title { color: var(--lime-dark); }
.change-item.fixing .change-body-title { color: #92400e; }
.change-item.pending .change-body-title { color: var(--faint); }
.change-body-desc { font-size: 11px; color: var(--faint); line-height: 1.5; font-weight: 300; }

.stage-note { max-width: 1040px; width: 100%; padding: 20px 24px; border-radius: 12px; border: 1.5px solid; font-size: 13px; line-height: 1.7; font-weight: 300; transition: all 0.4s; }
.stage-note.now { border-color: rgba(245,158,11,0.3); background: #FFFBF0; color: #92400e; }
.stage-note.progress { border-color: rgba(0,87,112,0.2); background: var(--teal-pale); color: var(--teal-dark); }
.stage-note.full { border-color: rgba(167,219,120,0.35); background: rgba(167,219,120,0.06); color: var(--lime-dark); }

</style>
</head>

<section class="visual-section" id="path">
  <div class="section-header"><div class="sh-num">01</div><div class="sh-label">The Obvious Path</div></div>
  <div class="main">
  <div class="title-block">
    <div class="eyebrow">Not a people problem. Not a company problem.</div>
    <h1>Work is complex.<br>People take <em>the path forward.</em></h1>
    <p class="subtitle">That's rational. Nobody is cutting corners - they're doing the job in front of them. The issue is that those reasonable choices in isolation quietly compound over time into something harder to untangle. Every industry. Same arc.</p>
  </div>

  <div class="industry-tabs">
    <button class="ind-tab active" onclick="setIndustry(0)" id="tab-0"><span>🏭</span> Manufacturing</button>
    <button class="ind-tab" onclick="setIndustry(1)" id="tab-1"><span>🎮</span> Game Development</button>
    <button class="ind-tab" onclick="setIndustry(2)" id="tab-2"><span>📡</span> Sales & CSP Ops</button>
  </div>

  <div class="chain-wrap">
    <div class="chain-label" id="chain-label">// manufacturing · how a defect compounds downstream</div>
    <div class="steps">
      <div class="step lit" id="st0"><div class="step-orb" id="so0">📦</div><div class="step-title" id="stit0">Supply</div><div class="step-note" id="snote0">Material arrives. Quality looks fine.</div></div>
      <div class="connector ok" id="cn0"><div class="conn-line"></div><div class="pkt"></div><div class="pkt d2"></div></div>
      <div class="step lit" id="st1"><div class="step-orb" id="so1">⚙️</div><div class="step-title" id="stit1">Assembly</div><div class="step-note" id="snote1">Unit built. Team moves fast.</div></div>
      <div class="connector ok" id="cn1"><div class="conn-line"></div><div class="pkt"></div></div>
      <div class="step warn" id="st2"><div class="step-orb" id="so2">💬</div><div class="step-title" id="stit2">Verbal handoff</div><div class="step-note" id="snote2">Context passed by mouth. Some lands.</div></div>
      <div class="connector warn" id="cn2"><div class="conn-line"></div><div class="pkt stall"></div></div>
      <div class="step warn" id="st3"><div class="step-orb" id="so3">🔍</div><div class="step-title" id="stit3">QA / check</div><div class="step-note" id="snote3">Working from partial context.</div></div>
      <div class="connector crack" id="cn3"><div class="conn-line"></div><div class="pkt stall"></div></div>
      <div class="step crack" id="st4"><div class="step-orb" id="so4">🏷️</div><div class="step-title" id="stit4">Delivery</div><div class="step-note" id="snote4">Defect surfaces here. 10× cost to fix.</div></div>
    </div>
  </div>

  <div class="compound-row" id="compound-row">
    <div class="compound-card"><div class="compound-step s1">// early on</div><div class="compound-title">The choice makes sense</div><div class="compound-body">Sending a quick message is faster than logging it. Telling someone verbally is more natural. The system feels fine because it mostly is.</div></div>
    <div class="compound-card"><div class="compound-step s2">// over time</div><div class="compound-title">Small gaps start to show</div><div class="compound-body">Someone misses context they should have had. A signal arrives late. A handoff loses something in translation. Noticed in hindsight, not in the moment.</div></div>
    <div class="compound-card"><div class="compound-step s3">// later still</div><div class="compound-title">The org runs on tribal knowledge</div><div class="compound-body">The people who know things become load-bearing. Not because they're exceptional - because they're the only ones who remember. That's a fragile place to be.</div></div>
  </div>

  <div class="bottom-note">
    <p>The goal isn't to change how people work. It's to make the <strong>structured path feel as natural as the obvious one</strong> - so the right context travels automatically, and the compounding stops.</p>
  </div>
</div>
</section>
<section class="visual-section" id="telephone">
  <div class="section-header"><div class="sh-num">02</div><div class="sh-label">The Telephone Effect</div></div>
  <div class="main">

  <!-- ══ PANEL A ══ -->
  <div class="panel-intro">
    <div class="panel-tag">Part 01 - The spread</div>
    <h2>Information travels. <em>Integrity doesn't.</em></h2>
    <p class="panel-sub">Nobody is doing anything wrong. One person shares what they understood. The next person shares what they heard. By the time it reaches the end of the chain, it's a different thing - and nobody knows it changed.</p>
  </div>

  <div class="spread-wrap" id="spread-wrap">

    ctx.moveTo(a.x, a.y);

    if (flow.progress >= 1) {

    const a = _nodes_2[flow.from], b = _nodes_2[flow.to];
    const t = flow.progress;
    // Quadratic bezier position
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2 - 20;
    const px = (1-t)*(1-t)*a.x + 2*(1-t)*t*mx + t*t*b.x;
    const py = (1-t)*(1-t)*a.y + 2*(1-t)*t*my + t*t*b.y;

    const grad = ctx.createRadialGradient(px, py, 0, px, py, 10);
    grad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0.6)`);
    grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);

    ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
    ctx.shadowColor = `rgb(${c.r},${c.g},${c.b})`;
    ctx.shadowBlur = 10;
    ctx.fill();

  });

    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.12 * appear})`;

    // Node circle
    ctx.beginPath();
    ctx.arc(node.x, node.y, r * appear, 0, Math.PI*2);
    const grad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, r);
    grad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0.4)`);
    grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0.1)`);
    ctx.fillStyle = grad;
    ctx.shadowColor = `rgb(${c.r},${c.g},${c.b})`;
    ctx.shadowBlur = 12 * appear;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(node.x, node.y, r * appear, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.7 * appear})`;
    ctx.lineWidth = 1.5; ctx.stroke();

    // Integrity pct
    const pct = Math.round(node.integrity * 100);

    ctx.fillStyle = `rgba(255,255,255,${0.7 * appear})`;
    ctx.fillText(node.label, node.x, node.y + r + 14);

    ctx.font = `300 9px JetBrains Mono, monospace`;
